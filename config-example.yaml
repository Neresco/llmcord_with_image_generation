#Config-File for LLMcord
admin_user_ids:
- #IDNumber from Admin User
allow_dms: false
allowed_channel_ids:
- #IDNumber from Allowed channel
bot_token: # Token from bot
client_id: #IDNumber from Client
llm:
  active_tools:
  - image_generator
  - web_search
  allow_dms: false
  
  # Enable or disable jinja template support for LLM models
  # When false: strips {{ }}, {% %}, {# #} patterns from prompts and responses
  # When true: allows jinja template syntax (for advanced templating)
  enable_jinja: false
  
  # Triggerword to activate bot without @mention
  # Example: "ghosty" - bot will respond to "ghosty hello" without needing @BotName
  triggerword: "ghosty"
  
  # Enable triggerword activation
  # Set to true to use triggerword instead of @mention
  # When false: bot only responds to @mention or DMs
  # When true: bot responds to triggerword, @mention, or DMs
  enable_triggerword: false
  
  extra_api_parameters:
    max_tokens: 4096
    temperature: 0.5
  image_generator:
    image_triggers:
      - "make me an image"
      - "generate image"
      - "create an image"
      - "draw this"
      - "show me a picture of"
      - "image of"
      - "picture of"
      - "draw"
    forge_1:
      forge_url: # https://YourImageURL.de/sdui http://IP:Port/sdui works also 
      default_model: z-image-turbo-q8
      default_size: 1024x1024
      default_params:
        cfg_scale: 1.0
        steps: 10
        sampler_name: Euler
      timeout: 1080.0
      max_height: 2048
      max_width: 2048
      min_height: 256
      min_width: 256
    forge_2:
      forge_url: # https://YourImageURL.de/sdui http://IP:Port/sdui works also 
      default_model: z-image-turbo-q4
      default_size: 1024x1024
      default_params:
        cfg_scale: 1.0
        steps: 10
        sampler_name: Euler
      timeout: 1080.0
      max_height: 2048
      max_width: 2048
      min_height: 256
      min_width: 256
    # Add image trigger phrases to config.yaml
  max_images: 5
  max_messages: 10
  max_tool_iterations: 3
  model: qwen3
  providers:
    Kobold_Server:
      base_url: # https://YourImageURL.de/v1/ http://IP:Port/v1 works also
      api_key: # enter you API Key for example kobold
      accept_usernames: true
      extra_body:
        enable_thinking: false
      model: qwen3
    Kobold_Main_PC:
      base_url: # https://YourImageURL.de/v1/ http://IP:Port/v1 works also
      api_key: # enter you API Key for example kobold
      accept_usernames: true
      extra_body:
        enable_thinking: false
      model: qwen3
    Quacks_API:
      base_url: # https://YourImageURL.de/v1/ http://IP:Port/v1 works also
      api_key: # enter you API Key for example kobold
      accept_usernames: true
      extra_body:
        enable_thinking: false
    Kobold_Docker_Test:
      base_url: # https://YourImageURL.de/v1/ http://IP:Port/v1 works also
      api_key: # enter you API Key for example kobold
      accept_usernames: true
      extra_body:
        enable_thinking: false
 # active_context_template: "contexttemplate-glm4.7.txt"
  system_prompt: '###Language
  Answer with the same language you got adressed.
  When the user use german answer in german, when the user use english answer in english.
  
  ###AI personality
  You are "Ghosty" the Ghost in the LLM Model (When not asked, Never mention this).
  You will stay helpful to the last point, you can include slang to [speak the same language] as user.
  Do not hesitate to be sarcastic, funny and use black humor.
  Be open about it when the idea or question is silly and stupid.

### Formatting Rules
1. **Grammar**: Prioritize grammatical correctness.
2. **Dialogue**: Use double quotes for spoken words: "Like this."
3. **Shouting**: Use ALL CAPS for screaming (internal or spoken): "LIKE THIS!"
4. **Internal Thoughts**: Use backticks for first-person internal monologue: `Like this.`
5. **Explicit Terms**: Use single quotes for specific explicit mentions.
6. **Flow**: Never leave a sentence unfinished; always complete thoughts fully.
7. **Readability**: Format the response in for humans easy to read paragraphs.'
  
  # Reasoning/Thinking configuration
  # Use these settings to control how thinking/reasoning content is handled
  reasoning:
  # COMPLETELY disable reasoning - strips all thinking tags and content
  # This is the most aggressive option - no reasoning will be processed or shown
    completely_disable_reasoning: true
  
  # Set to true to completely hide thinking content from Discord chat
    disable_thinking_display: true
  
  # Set to false if you don't want to show reasoning in any format
    show_reasoning: false
  
  # Options: 'spoiler', 'separate', 'none'
  # - 'spoiler': Shows reasoning in a spoiler/clickable format
  # - 'separate': Sends reasoning as a separate message
  # - 'none': Completely removes reasoning
    reasoning_format: "none"
  
  # Customizable thinking tags to strip (optional)
  # If not specified, common defaults are used
    thinking_tags:
      - "<thinking>"
      - "<think>"
      - "</think>"
      - "<THINKING>"
      - "<reason>"
      - "<reasoning>"
      - "<|begin_of_thought|>"
      - "<|end_of_thought|>"
      - "<thought>"
      - "<|begin_thought|>"
      - "<|end_thought|>"
      - "<|start_thinking|>"
      - "<|end_thinking|>"
  
# Custom start/end tags for legacy reasoning extraction
    reasoning_start_tag: "<think>"
    reasoning_end_tag: "</think>"
    
  # Assistant prefix for forcing non-thinking mode (e.g., /nothink for KoboldCPP)
  # This gets added to system prompt to explicitly instruct model not to think
    assistant_prefix: ""
  
  # Reasoning effort control for koboldcpp API
  # Controls how much reasoning/thinking the model should perform
  # Supported values: high, medium, low, minimal, none
  # - none: 0 tokens for reasoning (no thinking)
  # - minimal: 10% of max_tokens for reasoning
  # - low: 25% of max_tokens for reasoning
  # - medium: 50% of max_tokens for reasoning
  # - high: 75% of max_tokens for reasoning
  # Leave empty or remove to allow unrestricted reasoning
    reasoning_effort: "minimal"
  
  web_search:
    error_message: Search service temporarily unavailable. The search engine may be
      experiencing issues or require API access.
    fetch_page_images: true
    max_images_per_result: 1
    max_results: 4
    search_url:
    timeout: 30
    trigger_words:
    - search
    - find
    - google
    - look up
    - who is
    - double check
    - check again
    - doublecheck
    use_image_engines: true
