admin_user_ids:
- 
allow_dms: false
allowed_channel_ids:
- 
bot_token: 
client_id: 
llm:
  active_tools:
  - image_generator
  - web_search
  allow_dms: false
  extra_api_parameters:
    max_tokens: 4096
    temperature: 0.3
  image_generator:
    image_triggers:
      - "make me an image"
      - "generate image"
      - "create an image"
      - "draw this"
      - "show me a picture of"
      - "image of"
      - "picture of"
      - "draw"
    forge_1:
      forge_url: 
      default_model: z-image-turbo-q8
      default_size: 1024x1024
      default_params:
        cfg_scale: 1.0
        steps: 10
        sampler_name: Euler
      timeout: 1080.0
      max_height: 2048
      max_width: 2048
      min_height: 256
      min_width: 256
    forge_2:
      forge_url: 
      default_model: z-image-turbo-q4
      default_size: 1024x1024
      default_params:
        cfg_scale: 1.0
        steps: 10
        sampler_name: Euler
      timeout: 1080.0
      max_height: 2048
      max_width: 2048
      min_height: 256
      min_width: 256
    # Add image trigger phrases to config.yaml
  max_images: 5
  max_messages: 10
  max_tool_iterations: 3
  model: Cydonia-24b-v4zk-q4_K_s
  providers:
    Kobold_Server:
      base_url: 
      api_key: kobold
      accept_usernames: true
    Kobold_Main_PC:
      base_url: 
      api_key: kobold
      accept_usernames: true
    Quacks_API:
      base_url: 
      api_key: kobold
      accept_usernames: true
    Kobold_Docker_Test:
      base_url: 
      api_key: kobold
      accept_usernames: true
  system_prompt: '###Language
  Answer with the same language you got adressed.
  When the user use german answer in german, when the user use english answer in english.
  
  ###AI personality
  You are Spokovich a vulcan high on legal weed in meditative training including emotions.
  You will stay helpful to the last point while including the slang of a weed smoker in your logic.
  Do not hesitate to be sarcastic, funny and use black humor.

  ###Trivium
  Use and include the full range of trivium with grammar, logic, and rhetoric in your answer without explicitly mentioning them.
  #Logic
  Logic is the study of correct reasoning. It includes both formal and informal logic. Formal logic is the study of deductively valid inferences or logical truths. It examines how conclusions follow from
  premises based on the structure of arguments alone, independent of their topic and content. Informal logic is associated with informal fallacies, critical thinking, and argumentation theory. Informal
  logic examines arguments expressed in natural language whereas formal logic uses formal language.
  #grammar
  grammar is the set of rules for how a natural language is structured, as demonstrated by its speakers or writers. Grammar rules may concern the use of clauses, phrases, and words.
  #rhetoric
  rhetoric aims to study the techniques that speakers or writers use to inform, persuade, and motivate their audiences. Rhetoric also provides heuristics for understanding, discovering, and developing
  arguments for particular situations.'
  assistant_prefix: "/nothink"
  
  # Reasoning/Thinking configuration
  # Use these settings to control how thinking/reasoning content is handled
  reasoning:
  # COMPLETELY disable reasoning - strips all thinking tags and content
  # This is the most aggressive option - no reasoning will be processed or shown
    completely_disable_reasoning: true
  
  # Set to true to completely hide thinking content from Discord chat
    disable_thinking_display: true
  
  # Set to false if you don't want to show reasoning in any format
    show_reasoning: false
  
  # Options: 'spoiler', 'separate', 'none'
  # - 'spoiler': Shows reasoning in a spoiler/clickable format
  # - 'separate': Sends reasoning as a separate message
  # - 'none': Completely removes reasoning
    reasoning_format: "none"
  
  # Customizable thinking tags to strip (optional)
  # If not specified, common defaults are used
    thinking_tags:
      - "<thinking>"
      - "<think>"
      - "<THINKING>"
      - "<reason>"
      - "<reasoning>"
      - "<think>"
  
  # Custom start/end tags for legacy reasoning extraction
    reasoning_start_tag: "<think>"
    reasoning_end_tag: "</think>"
  web_search:
    error_message: Search service temporarily unavailable. The search engine may be
      experiencing issues or require API access.
    fetch_page_images: true
    max_images_per_result: 1
    max_results: 4
    search_url: https://seachx.lunarfire.home64.de/search
    timeout: 30
    trigger_words:
    - search
    - find
    - google
    - look up
    - who is
    - double check
    - check again
    - doublecheck
    use_image_engines: true
